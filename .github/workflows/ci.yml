name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax gate (byte-compile all sources)
        run: python -m compileall -q .

      - name: Run tests
        # Whole suite, deliberately NOT a hand-maintained file list. The old
        # allow-list silently excluded every test file added after it was
        # written, so the Houston / Chicago DC regression tests never ran in
        # CI -- the same drift that let those bugs reach production in the
        # first place. Anything that needs heavy optional deps should skip
        # itself (test_cheney_stock_ocr.py mocks its OCR layer).
        run: python -m pytest -q

  # Deterministic deploy: trigger Render via a Deploy Hook once tests pass,
  # instead of relying on Render's GitHub auto-deploy webhook (which has been
  # delivering late / dropping pushes). Dormant until the RENDER_DEPLOY_HOOK_URL
  # repo secret is set (Render dashboard -> the service -> Settings -> Deploy Hook).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (if hook configured)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            # Pin the exact commit: a bare hook deploys Render's (sometimes
            # stale) cached branch tip, so always pass ref=<this commit SHA>.
            curl -fsS "$HOOK&ref=$GITHUB_SHA" >/dev/null && echo "Render deploy triggered for $GITHUB_SHA."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set - skipping CI-driven deploy."
            echo "Add it under repo Settings -> Secrets and variables -> Actions"
            echo "to deploy automatically after tests pass."
          fi
