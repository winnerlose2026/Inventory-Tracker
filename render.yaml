# Render Blueprint for the Inventory-Tracker family: the bagel-inventory web
# service, the 6-hour mailbox-scan cron and the Lineage PO follow-ups cron.
#
# WHAT IS DASHBOARD-MANAGED (read this before trusting the file):
#   * These services were created by hand in the Render dashboard, NOT from
#     this blueprint. Nothing here is applied automatically. Keep the two in
#     step by hand; where they differ, the dashboard is what runs.
#   * Every `sync: false` value (secrets, logins, tokens) lives ONLY in the
#     dashboard. This file lists the key so nobody forgets it exists.
#   * Deploys: autoDeploy is OFF. The web service is deployed by the GitHub
#     Actions deploy job (.github/workflows/ci.yml) through its Deploy Hook
#     after the tests pass; the workflow then waits for /healthz to report
#     the new commit, checks /readyz, and only then triggers the scan cron's
#     hook (RENDER_CRON_DEPLOY_HOOK_URL, optional).
#   * Health check path: /healthz (set in the dashboard: Settings -> Health
#     Check Path). /readyz and /healthz/deep are for people and CI.
#
# IN-PROCESS JOBS (scheduler.py, started once by gunicorn's arbiter -- see
# gunicorn.conf.py). They are NOT Render services; all times UTC:
#   forecast-burn     05:05 daily   POST /api/forecast/decrement-daily
#                                   (+ fills missed days in the last 7)
#   graph-renew       09:00, 21:00  POST /api/graph/subscriptions/renew
#   production-scan   23:30 daily   POST /api/production/scan
#   delivery-sync     :07/:27/:47 from 10:00 to 03:59
#                                   POST /api/pos/delivery/sync-threads
#   toast-nightly     08:15 daily   POST /api/toast/nightly-pull
#   backup            hourly :20    POST /api/admin/backup/run
#   watchdog          hourly :40    POST /api/watchdog/run (alert email)
#   heartbeat         every 5 min   feed "scheduler"
#   catch-up          90 s after every start: re-runs an overdue job
# Toggle the lot with INPROCESS_SCHEDULER (default on). The former cron
# services bagel-inventory-forecast-daily and bagel-inventory-graph-sub-renew
# must stay deleted/suspended in the dashboard (a blueprint re-sync would not
# delete them).
#
# Region: every service is pinned to `virginia` so the family is co-located
# with the web service's persistent disk (which can't move regions) and close
# to H&H's East-Coast ops + MS365 mailboxes.
#
# Runtime: Python is pinned via the repo's .python-version so builds are
# reproducible and don't silently drift when Render bumps its native-runtime
# default.
#
# Secrets (sync:false) are NOT carried in this file. Set them once on each
# service in the dashboard; Render preserves them across blueprint re-syncs.
# Only non-secret values (schedules, mailbox list, etc.) live here.

services:
  - type: web
    name: bagel-inventory
    runtime: python
    plan: starter
    branch: main
    region: virginia
    buildCommand: pip install -r requirements.txt
    # gunicorn.conf.py holds workers/threads/timeout/bind AND starts the
    # in-process scheduler once via its when_ready hook.
    startCommand: gunicorn -c gunicorn.conf.py app:app
    # Shallow liveness probe (touches no data). Dashboard: Settings -> Health
    # Check Path must say the same.
    healthCheckPath: /healthz
    # Deploys come from the CI deploy hook only, after tests pass.
    autoDeploy: false
    disk:
      # ALL state lives here as JSON files: inventory, the usage ledger, POs,
      # production, the activity log and data/backups/ (hourly snapshots).
      name: inventory-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      # --- Access (all dashboard-managed secrets) ---------------------------
      # Master API key: full access. Also what the in-process jobs use to
      # call this service, so it must be set.
      - key: INVENTORY_API_TOKEN
        sync: false
      # Optional named keys, each limited to a scope:
      #   name:token:scope[,name:token:scope...]
      #   scope = full | read | ingest | send | backup   (join with +)
      - key: INVENTORY_API_TOKENS
        sync: false
      # Limited key for the Lineage delivery task (its four routes only).
      - key: DELIVERY_API_TOKEN
        sync: false
      # Browser login: comma-separated allowlist + ONE shared password.
      - key: INVENTORY_USERNAMES
        sync: false
      - key: INVENTORY_PASSWORD
        sync: false
      # Who may run seed reset / restore / backup restore. Empty = every
      # logged-in user (as before).
      - key: INVENTORY_ADMINS
        sync: false
      # Signs the login cookie. If unset the app derives a stable key from
      # INVENTORY_API_TOKEN and logs a warning; set it once and leave it
      # (changing it signs everyone out).
      - key: FLASK_SECRET_KEY
        sync: false
      # Uncomment (value "on") once everyone has signed in again after the
      # release that introduced it: sessions issued before then stop working.
      # - key: SESSION_REQUIRE_PWV
      #   value: "on"
      # --- Alerts ----------------------------------------------------------
      # Where the watchdog's email goes (default jd@hhbagels.com; must be in
      # EMAIL_SEND_ALLOWED_DOMAINS). ALERTS_ENABLED=off silences it.
      - key: ALERT_EMAIL_TO
        sync: false
      # - key: ALERTS_ENABLED
      #   value: "on"
      # Sender for /api/email/send and the alert email (else first MS365_USER).
      - key: MS365_SEND_AS
        sync: false
      # --- Toast (Report tab sales pulls, nightly pull) --------------------
      - key: TOAST_CLIENT_ID
        sync: false
      - key: TOAST_CLIENT_SECRET
        sync: false
      - key: TOAST_API_HOSTNAME
        sync: false
      - key: TOAST_USER_ACCESS_TYPE
        sync: false
      # In-process scheduler on/off (default on). Set to "off" to stop every
      # in-process job listed at the top of this file without a code change.
      - key: INPROCESS_SCHEDULER
        value: "on"
      # Days of missed forecast burn the 05:05 job may fill (0 = none).
      # - key: FORECAST_BACKFILL_DAYS
      #   value: "7"
      - key: MS365_TENANT_ID
        sync: false
      - key: MS365_CLIENT_ID
        sync: false
      - key: MS365_CLIENT_SECRET
        sync: false
      - key: MS365_USER
        sync: false
      - key: MS365_FOLDER
        value: Inbox
      - key: PO_LEAD_DAYS
        value: "30"
      # Real-time Daily Production via Microsoft Graph change notifications.
      # GRAPH_WEBHOOK_BASE is the public HTTPS root of THIS service — Graph
      # POSTs new-message pings to <base>/webhooks/graph/notifications. The
      # client state is an arbitrary secret that Graph echoes back on every
      # call so the webhook can confirm the request is genuine.
      - key: GRAPH_WEBHOOK_BASE
        sync: false  # e.g. https://bagel-inventory.onrender.com
      - key: GRAPH_SUB_CLIENT_STATE
        sync: false  # any long random string; treat like a token
      # /api/email/send policy (2026-10-22). Recipients must be in these
      # domains (default below); a body "from" is honoured only if it is
      # MS365_SEND_AS or listed in EMAIL_SEND_ALLOWED_FROM (default
      # jd@hhbagels.com, the chasers' sender). Uncomment to override.
      # - key: EMAIL_SEND_ALLOWED_DOMAINS
      #   value: usfoods.com,cheneybrothers.com,chefswarehouse.com,onelineage.com,hhbagels.com
      # - key: EMAIL_SEND_ALLOWED_FROM
      #   value: jd@hhbagels.com
      #
      # FTPS (Cheney / USF cPanel feed: integrations/sftp_inbox.py, used by
      # scripts/pull_sftp_inbox.py and scripts/sync_cheney_feeds.py wherever
      # they run). The TLS cert CHAIN is always verified against the system
      # CAs; set this to the name on the server's certificate (GoDaddy shared
      # hosting: its *.secureserver.net hostname, NOT sftp.hhbagels.com) to
      # also check the name. Unset = chain-only verification.
      # - key: FTPS_TLS_SERVER_NAME
      #   value: <the cPanel server's own hostname>

  - type: cron
    name: bagel-inventory-6h-scan
    runtime: python
    plan: starter
    branch: main
    region: virginia
    # Every 6 hours, on the hour (UTC). Runs at 00, 06, 12, 18 UTC every
    # day. Covers U.S. business hours year-round regardless of daylight
    # saving (a fixed UTC cron drifts an hour against local time twice a
    # year, which is fine for an order-ingestion scan).
    #
    # ONE LIVE INGEST PATH (2026-10-08). The startCommand below is what the
    # dashboard runs (this cron is not blueprint-managed; keep the two in
    # sync by hand). cowork_graph_scan.py defaults to --mode server: it does
    # NO parsing, it POSTs /api/email/scan (POs, weekly count/usage reports,
    # Chefs Warehouse) and then /api/freight/scan (Lineage ship dates) on the
    # web service, so every ingest -- this cron, the laptop Cowork task,
    # "Scan now" -- runs the same deployed parsers under the same ingest lock
    # and stamps documents the same way (MIME Date header). A 409 from a scan
    # already in progress is retried (4 x 90 s).
    #
    # The --lookback-hours / --lineage-lookback-hours flags only apply to
    # --mode local (SCAN_MODE=local): the old Graph-direct parse that POSTs
    # /api/email/ingest-events, kept for when the web service itself cannot
    # reach Graph. Local mode stamps Graph sentDateTime (= the Date header).
    # Before 10/8 local mode was the live cron path and stamped
    # receivedDateTime, so the two paths re-ordered each other's PO copies.
    #
    # HOUSTON SCREENSHOTS (2026-10-15). After the two scans, server mode asks
    # GET /api/email/usf-screenshots whether a Houston reply (Tom Foley's
    # buyer-screen picture + typed cs/wk) newer than the last count is
    # waiting. Only then does it pip-install requirements-ocr-usf.txt into
    # /tmp (~40 s, ~370 MB on disk, ~370 MB RAM peak while reading) and run
    # scripts/usf_screenshot_ocr.py --commit. So neither build carries an OCR
    # engine and a normal run costs one GET. A blocked read fails the run.
    # USF_SCREENSHOT_OCR=off disables the step.
    #
    # Server mode needs only APP_URL + INVENTORY_API_TOKEN; the MS365_* vars
    # are used by local mode alone.
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    # Server mode: /api/email/scan lookback 14 d x 200 msgs/mailbox, freight
    # 14 d (see --server-lookback-days / --freight-lookback-days).
    startCommand: python scripts/cowork_graph_scan.py --lookback-hours 24 --lineage-lookback-hours 2160
    envVars:
      - key: APP_URL
        sync: false  # set to https://<your-service>.onrender.com
      - key: INVENTORY_API_TOKEN
        sync: false
      - key: MS365_TENANT_ID
        sync: false
      - key: MS365_CLIENT_ID
        sync: false
      - key: MS365_CLIENT_SECRET
        sync: false
      - key: MAILBOXES
        value: JD@ms.hhbagels.com,info@ms.hhbagels.com

  # Lineage PO follow-ups: on weekdays, chase delivery confirmations that are
  # overdue. NOT YET CREATED in the dashboard -- create it by hand with these
  # settings once scripts/lineage_followups.py is on main. It needs only the
  # LIMITED delivery key, never the master token.
  - type: cron
    name: lineage-po-followups
    runtime: python
    plan: starter
    branch: main
    region: virginia
    # 14:50 and 20:50 UTC, Monday-Friday (9:50 am / 3:50 pm Eastern in winter).
    schedule: "50 14,20 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/lineage_followups.py
    envVars:
      - key: APP_URL
        sync: false  # https://bagel-inventory.onrender.com
      - key: DELIVERY_API_TOKEN
        sync: false
